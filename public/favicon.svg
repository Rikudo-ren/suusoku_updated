<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset="0.55" stop-color="#7f6bff"/>
      <stop offset="1" stop-color="#ff2bd1"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7ff5ff"/>
      <stop offset="0.5" stop-color="#22e4ff"/>
      <stop offset="1" stop-color="#ff2bd1"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#0b1830"/>
      <stop offset="0.55" stop-color="#050a16"/>
      <stop offset="1" stop-color="#03060d"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="boltGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <polygon points="2,10 10,2 47,2 62,17 62,54 54,62 17,62 2,47"/>
    </clipPath>
  </defs>

  <!-- cut-corner HUD panel, echoing the app's .clip-panel motif -->
  <g filter="url(#softGlow)">
    <polygon points="2,10 10,2 47,2 62,17 62,54 54,62 17,62 2,47" fill="url(#bg)"/>
  </g>

  <!-- faint interior grid for depth, matching .cyber-grid texture -->
  <g clip-path="url(#panelClip)" opacity="0.5">
    <path d="M2 16 H62 M2 26 H62 M2 38 H62 M2 48 H62" stroke="#22e4ff" stroke-width="0.5" opacity="0.16"/>
    <path d="M16 2 V62 M26 2 V62 M38 2 V62 M48 2 V62" stroke="#22e4ff" stroke-width="0.5" opacity="0.16"/>
  </g>

  <!-- panel border -->
  <polygon points="2,10 10,2 47,2 62,17 62,54 54,62 17,62 2,47"
    fill="none" stroke="url(#edge)" stroke-width="2.6" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- corner calibration ticks, small HUD accent -->
  <g stroke="#ff2bd1" stroke-width="1.6" stroke-linecap="round" opacity="0.95">
    <path d="M6 6 L6 12 M6 6 L12 6"/>
  </g>
  <g stroke="#22e4ff" stroke-width="1.6" stroke-linecap="round" opacity="0.95">
    <path d="M58 58 L58 52 M58 58 L52 58"/>
  </g>

  <!-- glitch-split bolt: chromatic-aberration duplicates behind the main glyph,
       echoing the site's .glitch title-text treatment -->
  <polygon points="33.7,15.0 16.7,35.4 32.0,35.4 30.3,49.0 47.3,28.6 32.0,28.6"
    fill="#ff2bd1" opacity="0.55" transform="translate(-1.6,0.9)"/>
  <polygon points="33.7,15.0 16.7,35.4 32.0,35.4 30.3,49.0 47.3,28.6 32.0,28.6"
    fill="#22e4ff" opacity="0.55" transform="translate(1.6,-0.9)"/>
  <polygon points="33.7,15.0 16.7,35.4 32.0,35.4 30.3,49.0 47.3,28.6 32.0,28.6"
    fill="url(#bolt)" filter="url(#boltGlow)"/>
</svg>
